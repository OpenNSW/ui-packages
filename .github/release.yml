# Groups the pull request list GitHub generates when someone clicks "Generate
# release notes" on a release. pr-labels.yml makes sure every PR carries one of
# these labels, or skip-changelog to leave it out.
#
# GitHub's list is NOT scoped to a package: it covers every PR merged since the
# previous release of any package. For a package release, use the
# release-package skill (.claude/skills/release-package) instead, which keeps
# only the PRs that belong to that package.
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Breaking Changes
      labels:
        - breaking change
    - title: New Features
      labels:
        - Type/New Feature
    - title: Improvements
      labels:
        - Type/Improvement
    - title: Bug Fixes
      labels:
        - Type/Bug
    # Type/Task lands here, as does anything that reached main unlabelled.
    - title: Other Changes
      labels:
        - '*'
