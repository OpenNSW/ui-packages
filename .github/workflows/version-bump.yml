name: Release - Bump package version

# Manually triggered: bumps "version" in a package's package.json and opens a
# PR against main, so cutting a release no longer needs a hand-written PR.
#
# How to cut a release (see CONTRIBUTING.md):
#   1. Actions tab -> "Release - Bump package version" -> Run workflow.
#      Fill in the package directory (e.g. jsonforms-renderers) and the new
#      version (e.g. 0.12.0, no leading "v").
#   2. Review and merge the PR it opens (the PR is labelled skip-changelog and
#      Package/<dir>, so it stays out of the release notes).
#   3. In Claude Code, run the release-package skill for that package. It drafts
#      the release notes from the PRs merged for that package since its last
#      release and creates a DRAFT GitHub Release pinned to the bump commit.
#   4. Review the draft on GitHub and press Publish. That creates the
#      <package-dir>-v<version> tag, which triggers release.yml, which builds and
#      STAGES the package on npm.
#   5. A maintainer approves the staged package on npm (2FA). Only then is it live.
#
# Note: this workflow pushes/opens its PR using the default GITHUB_TOKEN, so
# packages-ci.yml will NOT run on the PR it creates (GitHub doesn't let the
# default token trigger other workflows, to avoid recursive runs). That's
# fine here since the PR only ever changes a version string — review the
# diff by eye before merging, or re-run CI from the Actions tab.

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package directory under packages/ to bump'
        required: true
        default: 'jsonforms-renderers'
        type: string
      version:
        description: 'New version to set, semver without a leading "v" (e.g. 0.12.0)'
        required: true
        type: string

concurrency:
  group: version-bump-${{ inputs.package }}-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-version:
    name: Open version bump PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Fail early with a clear message rather than partway through a git push.
      # The inputs reach the shell through env, never by interpolation into the
      # script text, and are checked against strict patterns before any use.
      - name: Validate inputs
        id: pkg
        env:
          PKG_DIR: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
        run: |
          # True when $1 has higher semver precedence than $2. A release outranks
          # its own pre-releases; build metadata is ignored.
          version_gt() {
            local a="${1%%+*}" b="${2%%+*}" a_pre="" b_pre=""
            [[ "$a" == *-* ]] && a_pre="${a#*-}"
            [[ "$b" == *-* ]] && b_pre="${b#*-}"
            local a_core="${a%%-*}" b_core="${b%%-*}"
            if [ "$a_core" != "$b_core" ]; then
              [ "$(printf '%s\n%s\n' "$a_core" "$b_core" | sort -V | tail -n1)" = "$a_core" ]
            elif [ "$a_pre" = "$b_pre" ]; then
              return 1
            elif [ -z "$a_pre" ]; then
              return 0
            elif [ -z "$b_pre" ]; then
              return 1
            else
              [ "$(printf '%s\n%s\n' "$a_pre" "$b_pre" | sort -V | tail -n1)" = "$a_pre" ]
            fi
          }

          if [[ ! "$PKG_DIR" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::'$PKG_DIR' is not a valid package directory name."
            exit 1
          fi
          PKG_PATH="packages/$PKG_DIR"

          if [ ! -f "$PKG_PATH/package.json" ]; then
            echo "::error::No package.json found at $PKG_PATH."
            exit 1
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION' is not a valid semver (expected e.g. 1.2.3 or 1.2.3-beta.1)."
            exit 1
          fi

          CURRENT_VERSION="$(node -p "require('./$PKG_PATH/package.json').version")"
          if ! version_gt "$VERSION" "$CURRENT_VERSION"; then
            echo "::error::$VERSION is not higher than the current version of $PKG_PATH ($CURRENT_VERSION)."
            exit 1
          fi

          PKG_NAME="$(node -p "require('./$PKG_PATH/package.json').name")"
          BRANCH="release/$PKG_DIR-v$VERSION"
          TAG="$PKG_DIR-v$VERSION"

          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            echo "::error::Branch $BRANCH already exists. Merge or delete the earlier bump PR first."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::error::Tag $TAG already exists, so $VERSION of $PKG_NAME is already released."
            exit 1
          fi

          echo "Package path:    $PKG_PATH"
          echo "Package name:    $PKG_NAME"
          echo "Current version: $CURRENT_VERSION"
          echo "New version:     $VERSION"

          {
            echo "path=$PKG_PATH"
            echo "name=$PKG_NAME"
            echo "branch=$BRANCH"
          } >> "$GITHUB_OUTPUT"

      - name: Bump version in package.json
        working-directory: ${{ steps.pkg.outputs.path }}
        env:
          VERSION: ${{ inputs.version }}
        run: npm pkg set version="$VERSION"

      - name: Commit and push branch
        env:
          PKG_PATH: ${{ steps.pkg.outputs.path }}
          PKG_NAME: ${{ steps.pkg.outputs.name }}
          BRANCH: ${{ steps.pkg.outputs.branch }}
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add "$PKG_PATH/package.json"
          git commit -m "chore(release): bump $PKG_NAME to v$VERSION"
          git push origin "$BRANCH"

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PKG_DIR: ${{ inputs.package }}
          PKG_PATH: ${{ steps.pkg.outputs.path }}
          PKG_NAME: ${{ steps.pkg.outputs.name }}
          BRANCH: ${{ steps.pkg.outputs.branch }}
          VERSION: ${{ inputs.version }}
        run: |
          cat > pr-body.md <<EOF
          Bumps \`$PKG_NAME\` (\`$PKG_PATH\`) to \`$VERSION\`.

          **After merging**, release it from Claude Code with the \`release-package\` skill:

          \`\`\`
          /release-package $PKG_DIR
          \`\`\`

          The skill collects the PRs merged for this package since its last release, drafts the release notes, and creates a **draft** GitHub Release pinned to the merge commit. Publishing that release creates the tag \`$PKG_DIR-v$VERSION\`, which triggers \`release.yml\` and stages the package on npm. A maintainer then approves it on npm (2FA) to make it live.

          CI does not run automatically on this PR (it is opened with the default \`GITHUB_TOKEN\`); it only changes a version string.

          _Opened by the \`version-bump.yml\` workflow._
          EOF

          url="$(gh pr create \
            --title "chore(release): bump $PKG_NAME to v$VERSION" \
            --base main \
            --head "$BRANCH" \
            --body-file pr-body.md)"
          echo "$url"

          # pr-labels.yml adds these too; doing it here keeps the PR correct even
          # if that workflow is slow, and a missing label must not fail the bump.
          gh pr edit "$url" --add-label skip-changelog --add-label "Package/$PKG_DIR" ||
            echo "::warning::Could not label $url; pr-labels.yml will."
