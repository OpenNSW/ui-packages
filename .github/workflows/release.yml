name: Release - Stage @opennsw package on npm

# Stages any package under packages/ on the npm registry when a release tag is
# pushed. The package is derived from the tag, so one workflow serves every
# package in the monorepo.
#
# This workflow can only STAGE. It runs `npm stage publish`, which uploads the
# tarball to npm's staging queue; the version is not installable until a
# maintainer approves it on npm with 2FA (see "Approving a staged release" in
# CONTRIBUTING.md). The package's trusted publisher on npmjs.com is limited to
# `npm stage publish`, so even a changed workflow cannot publish directly.
#
# Tag convention: <package-dir>-v<semver>
#   - <package-dir> is the folder name under packages/
#   - <semver> must match the "version" in that package's package.json
#
# How to cut a release:
#   1. Bump "version" in packages/<package-dir>/package.json and merge to main.
#   2. Tag that commit and push the tag, e.g.:
#        git tag jsonforms-renderers-v0.3.1
#        git push origin jsonforms-renderers-v0.3.1
#   3. This workflow resolves the package from the tag, verifies the version,
#      builds, and stages the package on npm.
#   4. A maintainer approves the staged package on npm (2FA). Only then is it live.
#
# Authentication: npm Trusted Publishing via GitHub OIDC — no NPM_TOKEN secret.
# One-time setup per package on npmjs.com: open the package's Settings ->
# Trusted Publisher, register GitHub Actions with this repo and workflow file
# `release.yml`, and under "Allowed actions" keep only `npm stage publish`. Also
# require two-factor authentication and disallow tokens in the package's
# publishing access, so there is no other way to publish. `id-token: write` + a
# recent npm CLI also attach build provenance (the verified badge on npmjs.com).

on:
  push:
    tags:
      - '*-v*.*.*'

# Don't run two stagings of the same tag concurrently.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and stage on npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing + provenance signing
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 11.1.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'
          cache-dependency-path: './pnpm-lock.yaml'

      # Trusted Publishing / OIDC requires npm CLI >= 11.5.1, and `npm stage`
      # requires >= 11.15.0. The npm bundled with Node 22.18 is older, so upgrade
      # it before staging. Pinned to the 11.x line (rather than @latest) because
      # npm 12 requires Node >=22.22.2, newer than the Node 22.18.0 pinned above.
      - name: Upgrade npm (trusted and staged publishing support)
        run: |
          npm install --global npm@11
          required=11.15.0
          installed="$(npm --version)"
          if [ "$(printf '%s\n%s\n' "$required" "$installed" | sort -V | head -n1)" != "$required" ]; then
            echo "::error::npm $installed is older than $required, which 'npm stage publish' needs."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Resolve the package directory and name from the tag, and fail early if
      # the tag version doesn't match the committed package.json version.
      - name: Resolve package from tag
        id: pkg
        run: |
          TAG="$GITHUB_REF_NAME"
          if [[ ! "$TAG" =~ ^(.+)-v([0-9]+\.[0-9]+\.[0-9]+.*)$ ]]; then
            echo "::error::Tag '$TAG' must match '<package-dir>-v<semver>', e.g. jsonforms-renderers-v0.3.1."
            exit 1
          fi
          PKG_DIR="${BASH_REMATCH[1]}"
          TAG_VERSION="${BASH_REMATCH[2]}"
          PKG_PATH="packages/$PKG_DIR"
          if [ ! -f "$PKG_PATH/package.json" ]; then
            echo "::error::No package.json found at $PKG_PATH (derived from tag '$TAG')."
            exit 1
          fi
          PKG_NAME="$(node -p "require('./$PKG_PATH/package.json').name")"
          PKG_VERSION="$(node -p "require('./$PKG_PATH/package.json').version")"
          echo "Tag:             $TAG"
          echo "Package path:    $PKG_PATH"
          echo "Package name:    $PKG_NAME"
          echo "Tag version:     $TAG_VERSION"
          echo "Package version: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match $PKG_PATH/package.json ($PKG_VERSION)."
            exit 1
          fi
          {
            echo "path=$PKG_PATH"
            echo "name=$PKG_NAME"
            echo "version=$PKG_VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Type check
        run: pnpm --filter "${{ steps.pkg.outputs.name }}" run type-check

      - name: Build package
        run: pnpm --filter "${{ steps.pkg.outputs.name }}" run build

      # Sanity-check the tarball (no real upload).
      - name: Stage dry run
        working-directory: ${{ steps.pkg.outputs.path }}
        run: npm stage publish --provenance --access public --dry-run

      # Uploads the tarball to npm's staging queue. Nothing is installable until a
      # maintainer approves it on npm, so a green run here does NOT mean the
      # version is live. The output (it carries the stage ID) goes to the job
      # summary, with the commands the approver needs.
      - name: Stage on npm
        working-directory: ${{ steps.pkg.outputs.path }}
        env:
          PKG_NAME: ${{ steps.pkg.outputs.name }}
          PKG_VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          set -o pipefail
          npm stage publish --provenance --access public 2>&1 | tee "$RUNNER_TEMP/stage.log"
          {
            echo "### Staged $PKG_NAME@$PKG_VERSION on npm"
            echo
            echo "**Not live yet.** A maintainer must approve it with 2FA: on npmjs.com (Staged Packages tab) or with"
            echo
            echo '```sh'
            echo "npm stage list $PKG_NAME"
            echo "npm stage download <stage-id>   # inspect the tarball first"
            echo "npm stage approve <stage-id>"
            echo '```'
            echo
            echo "Output of \`npm stage publish\`:"
            echo
            echo '```'
            cat "$RUNNER_TEMP/stage.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
