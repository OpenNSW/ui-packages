name: PR Title

# main takes squash merges only, and the squash commit's subject is the PR
# title, so the title is what ends up in the history. It must be a Conventional
# Commit: `type(scope): description`, with `!` before the colon for a breaking
# change, e.g.
#
#   feat(jsonforms-renderers): add x-search.dependsOn
#   fix(auth): refresh the token before it expires
#   feat(xml-export)!: write dates in the configured format
#
# The type also drives the release-notes label (pr-labels.yml). The scope is
# optional and free-form (a package or a feature area). Types: feat, fix, docs,
# style, refactor, perf, test, build, ci, chore, revert.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  title:
    name: Conventional Commit Title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
